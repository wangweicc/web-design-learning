<!DOCTYPE html>
<html>

<head>
    <title>滚动文本示例</title>
</head>

<body>
    <table border="1" bordercolor="red" bgcolor="#6699ff" cellpadding="5" cellspacing="0" align="center">
        <tr>
            <td>
                <font face="隶书" color="#FF00FF">
                    <script language="javascript">
                        document.write("<marquee scrollamount='1' scrolldelay='30' direction='UP' width='200' id='helpor_net' height='150' onmouseover='helpor_net.stop()' onmouseout='helpor_net.start()'>Author:redriver; For more,visit:www.helpor.net");
                        document.write("<h2><p align='center'><font color='#ffff00' face='隶书'>偶然</font></h2>");
                        document.write("<p align='right'><a href='#' target='_blank'><font color='red'>徐志摩</font></a>");
                        document.write("<p><font color='#ffff00'>");
                        document.write("我是天空里的一片云，");
                        document.write("偶尔投影在你的波心—— ");
                        document.write("你不必讶异，");
                        document.write("更无须欢喜—— ");
                        document.write("在转瞬间消灭了踪影。");
                        document.write("<br>");
                        document.write("你我相逢在黑暗的海上，");
                        document.write("你有你的，我有我的，方向；");
                        document.write("你记得也好，");
                        document.write("最好你忘掉，");
                        document.write("在这交会时互放的光亮！ ");
                        document.write("</font>");
                        document.write("</marquee>");
                    </script>
                </font>
            </td>
        </tr>
    </table>
</body>

</html>
