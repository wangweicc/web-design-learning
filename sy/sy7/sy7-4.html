<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS浮动属性设置</title>
    <style>
        .float-text1 {
            float: left;
            font-size: 32px;
            margin-top: -6px;
            margin-right: 16px;
        }

        .float-text3 {
            float: left;
            font-size: 32px;
            margin-top: 12px;
            margin-bottom: 12px;
        }

        .float-text2 {
            float: left;
            font-size: 15px;
            margin-right: 16px;
        }

        .float-text {
            float: left;
            width: 300px;
            font-size: 20px;
            margin-right: 10px;
        }

        .clear-float {
            clear: both;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <span class="float-text1">浮动属性</span>
        <span>允许网页设计者将文本浮动在一个元素的周围。</span><br>
        <span>允许网页设计者将文本浮动在一个元素的周围。</span><br>
        <span>允许网页设计者将文本浮动在一个元素的周围。</span>
        <br>

        <div class="float-text3">
            清除浮动
        </div>

        <div class="clear-float">
            清除浮动不允许网页设计者将文本浮动在一个元素的周围。
            清除浮动不允许网页设计者将文本浮动在一个元素的周围。
            清除浮动不允许网页设计者将文本浮动在一个元素的周围。
        </div>
    </div>
</body>

</html>
