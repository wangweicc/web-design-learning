<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS文本属性设置</title>
    <style>
        .text1 {

            text-align: center
        }

        .text2 {
            line-height: 200%;
        }

        .text3 {
            text-decoration: underline overline;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .text4 {
            text-indent: 0.75cm;
        }
    </style>
</head>

<body>
    <div class="text1">文字居中</div>
    <div class="text2">行高定义为10%</div>
    <div class="text3">文字同时显示上划线和下划线</div>
    <div class="text4">首行缩进0.75cm</div>
</body>

</html>
