<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置CSS文本样式</title>
    <style>
        .title {
            font-family: 隶书;
            font-weight: bold;
            font-size: 48px;
            color: red;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .author {
            font-family: 宋体;
            font-style: italic;
            font-size: 24px;
            color: #cc9900;
            text-align: center;
            margin-bottom: 30px;
        }

        .content {
            font-family: 宋体;
            font-size: 32px;
            color: blue;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="title">《登鹳鹊楼》</div>
    <div class="author">王之涣</div>
    <div class="content">
        白日依山尽，黄河入海流。欲穷千里目，更上一层楼。
    </div>

    <div class="title">《相思》</div>
    <div class="author">王维</div>
    <div class="content">
        红豆生南国，春天发几枝。愿君多采撷，此物最相思。
    </div>
</body>

</html>
