<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS定位属性设置</title>
    <style>
        .absolute-text {
            position: absolute;
            top: 50px;
            left: 50px;
            font-size: 48px;
            color: blue;
        }

        .relative-text1 {
            position: relative;
            top: 49px;
            left: 46px;
            font-size: 48px;
            color: yellow;
        }

        .relative-text4 {
            position: relative;
            top: -85px;
            left: 45px;
            font-size: 48px;
            color: yellow;
        }

        .relative-text2 {
            position: relative;
            top: -14px;
            left: 49px;
            font-size: 48px;
            color: red;
        }

        .relative-text5 {
            position: relative;
            top: -147px;
            left: 48px;
            font-size: 48px;
            color: red;
        }

        .relative-text3 {
            position: relative;
            top: -22px;
            left: 41px;
            font-size: 48px;
            color: blue;
        }
    </style>
</head>

<body>
    <div class="absolute-text">定位属性示例</div>
    <div class="relative-text1">定位属性示例</div>
    <div class="relative-text2">定位属性示例</div>
    <div class="relative-text3">定位属性示例</div>
    <div class="relative-text4">定位属性示例</div>
    <div class="relative-text5">定位属性示例</div>

</body>

</html>
