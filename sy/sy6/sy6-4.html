<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超链接的样式应用</title>
    <style>
        a:link {
            color: green;
            text-decoration: none;
        }

        a:visited {
            color: red;
            text-decoration: none;
        }

        a:hover {
            color: blue;
            text-decoration: overline;
            font-size: 25pt;
        }
    </style>

</head>

<body>
    <p style="font-size: 48; font-style: bold;">
        <a href="mystyle.css">www.eszy.edu.cn</a>
    </p>
</body>

</html>
