<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内部样式表应用</title>
    <style type="text/css">
        h1 {
            color: #ff0000;
            font-family: 黑体;
        }

        .mystyle {
            color: #0000ff;
            font-family: 黑体;
            font-size: 64px;
        }

        p.first {
            color: #000000;
            font-family: 宋体;
            font-size: 12px;
        }

        p.second {
            color: #00ff00;
            font-family: 宋体;
            font-size: 32px;
        }
    </style>
</head>

<body>
    <p style="font-size:72;font-style:bold;color:red;">这是一段红色粗体文字</p>
    <p style="font-size:72;font-style:italic;color:red;">这是一段红色斜体文字</p>
    <p>这段文字没有应用样式</p>
    <h1>网页设计制作</h1>
    <p class="first">网页设计制作</p>
    <p class="second">网页设计制作</p>
    <p class="mystyle">网页设计制作</p>
    <div class="mystyle">网页设计制作</div>
</body>

</html>
