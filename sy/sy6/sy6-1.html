<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行内样式表应用</title>
</head>

<body>
    <p style="font-size:72;font-style:bold;color:red;">这是一段红色粗体文字</p>
    <p style="font-size:72;font-style:italic;color:red;">这是一段红色斜体文字</p>
    <p>这段文字没有应用样式</p>
</body>

</html>
