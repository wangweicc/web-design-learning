<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS+DIV布局</title>
    <style>
        #nav {
            margin: 0px auto;
            border: 0px;
            background: #ccd2de;
            width: 580px;
            height: 60px;
            text-align: center;
            padding-top: 50px;
            margin-top: 4px;
        }

        #mainbox {
            margin: 0px auto;
            width: 580px;
            background: #FFFFFF;
        }

        #menu {
            float: right;
            margin: 2px 0px 2px 0px;
            padding: 0px 0px 0px 0px;
            width: 400px;
            background: #ccd2de;
        }

        #sidebar {
            float: left;
            margin: 2px 2px 0px 0px;
            padding: 0px;
            background: #F2F3F7;
            width: 170px;
        }

        #content {
            float: right;
            margin: 1px 0px 2px 0px;
            padding: 0px;
            width: 400px;
            background: #E0EFDE;
        }

        #footer {
            clear: both;
            margin: 0px auto;
            padding: 5px 0px 5px 0px;
            background: #ccd2de;
            height: 40px;
            width: 580px;
            text-align: center;
            padding-top: 20px;
            margin-bottom: 4px;
        }

        body {
            border: 2px solid red;
            margin-left: 468px;
            margin-right: 468px;
            margin-top: 0px;
            margin-bottom: 0px;
        }
    </style>
</head>

<body>
    <div id="nav">
        这是nav区域
    </div>

    <div id="mainbox">
        <div id="menu">这是menu区域</div>
        <div id="sidebar">这是sidebar区域</div>
        <div id="content">
            <p>这是content区域</p>
            <p>这里是主要内容，根据内容自动适应高度</p>
            <p>这里是主要内容，根据内容自动适应高度</p>
            <p>这里是主要内容，根据内容自动适应高度</p>
        </div>
    </div>

    <div id="footer">
        这是footer区域
    </div>
</body>

</html>
