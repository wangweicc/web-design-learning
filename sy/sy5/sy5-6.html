<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .gallery {
            width: 80%;
            margin: 20px auto;
            text-align: center;
            border: 1px solid #ccc;
            padding: 20px;
            background-color: white;
            overflow: hidden;
            /* Hide overflow */
        }

        .gallery img {
            width: 150px;
            height: 150px;
            margin: 10px;
            border: 1px solid #ccc;
            cursor: pointer;
            display: inline-block;
            animation: scroll 20s linear infinite;
        }

        .gallery img:hover {
            border: 2px solid green;
        }

        hr {
            border: 6px solid green;
        }

        h1 {
            margin-bottom: 40px;
        }

        @keyframes scroll {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(-100%);
            }
        }
    </style>
</head>
