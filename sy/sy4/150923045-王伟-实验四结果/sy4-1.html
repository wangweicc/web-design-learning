<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单留言板设计</title>
    <style>
        /* 第1图层样式 */
        #div1 {
            background-color: #f2f9fd;
            color: #66ffff;
            width: 100%;
            height: 37px;
        }

        /* 第2图层样式 */
        #div2 {
            background-color: #f2f9fd;
            color: #66ffff;
            width: 100%;
            height: 27px;
            margin-top: 3px;
        }

        #div7 {
            background-color: #f2f9fd;
            color: #66ffff;
            width: 100%;
            height: 27px;
            margin-top: -10px;
        }

        #div4 {
            background-color: #f2f9fd;
            color: #66ffff;
            width: 100%;
            height: 83px;
            margin-top: 3px;
        }

        #div5 {
            background-color: #f2f9fd;
            color: #66ffff;
            width: 100%;
            height: 28px;
            margin-top: 3px;
            text-align: center;
        }

        #div6 {
            background-color: #f2f9fd;
            color: #66ffff;
            width: 100%;
            height: 40px;
            margin-top: -10px;
        }

        /* 第3图层样式 */
        #div3 {
            background-color: #f2f9fd;
            color: red;
            width: 100%;
            height: 24px;
            margin-top: -1%;
        }

        /* 单元格1样式 */
        .td1 {
            line-height: 22px;
            font-size: 18px;
            color: #339966;
            width: 100px;
            font-weight: bold;
        }

        /* 单元格2样式 */
        .td2 {
            line-height: 42px;
            font-size: 18px;
            color: #339966;
            width: 100px;
            font-weight: bold;
        }

        /* 标题1样式 */
        .bt1 {
            font-size: 30px;
            font-family: 黑体;
            font-weight: bold;
            text-align: left;
            width: 500px;
            color: #0033cc;
        }

        /* 标题2样式 */
        .bt2 {
            font-size: 22px;
            font-family: 黑体;
            font-weight: bold;
            text-align: left;
            width: 200px;
            color: #0033cc;
        }

        .submit-btn {
            margin-left: 30px;
            margin-right: 30px;
        }
    </style>
</head>

<body>
    <form>
        <div id="div1">
            <span class="bt1">留言板</span>
            <span class="bt2">科技工作者建言</span>
        </div>

        <div id="div3">
            <h4>发&nbsp;表&nbsp;留&nbsp;言</h4>
        </div>

        <div id="div2">
            <form>
                <table>
                    <label for="">姓名：&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>

                    <input type="text" id="name" name="name" style="width: 8%;"><br>
                </table>
            </form>
        </div>

        <div id="div2">
            <form>
                <table>
                    <label for="email">电子邮件：&nbsp;&nbsp;&nbsp;&nbsp;</label>
                    <input type="text" id="email" name="email" style="width: 20%;"><br>
                </table>
            </form>
        </div>

        <div id="div2">
            <form>
                <table>
                    <label for="category">分类：&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
                    <label for="category">科技工作者建言&nbsp;&nbsp;</label>
                    <input type="radio" name="secret">不保密
                    <input type="radio" name="secret">保密&nbsp;&nbsp;
                    <form>
                        留言类型：
                        <select style="width: 3%;">
                            <option></option>
                            <option>工作留言</option>
                            <option>互助留言</option>
                        </select><br>
                </table>
            </form>
        </div>

        <div id="div4">
            <form>
                <table>
                    <label for="message">留言：&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </table>
            </form>
        </div>

        <div id="div7">
            <form>
                <table>
                    <p style="font-size: 14px; color: #666666; text-indent: 2em;">
                        注：如果您的留言不便公开，请选择“保密”选项，提交后可凭系统反馈给您的留言编号、查询密码和您的姓名查询回复。
                    </p>
                </table>
            </form>
        </div>

        <div id="div5">
            <form>
                <table>
                    <input type="submit" class="submit-btn"></input>
                    <input type="reset" class="submit-btn" value="清空"></input>
                </table>
            </form>
        </div>

        <div id="div6">
            <form>
                <ul style="font-size: 14px; color: #666666;">
                    <li>
                        请遵守国家有关法律、法规，尊重网上道德，承担一切因您的行为而直接或间接引起的法律责任。
                    </li>
                    <li>
                        本网站拥有管理笔名和留言的一切权利。
                    </li>
                </ul>
            </form>
        </div>



    </form>
</body>

</html>
