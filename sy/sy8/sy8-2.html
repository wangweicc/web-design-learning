<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>样式表举例</title>
    <style>
        h1 {
            font-size: 36px;
            font-family: "隶书";
            font-weight: bold;
            color: #993366;
        }

        .red-kaiti {
            font-family: 楷体;
            color: red;
        }

        /* 定义ID选择符 */
        #last-paragraph {
            font-family: 隶书;
            color: blue;
            text-align: center;
        }
    </style>
</head>

<body>
    <p class="red-kaiti">这段文字将显示为红色</p>
    <p class="red-kaiti">这段文字的背景色为<font color="FF0000"><b>黄色</b></font>
    </p>
    <p class="red-kaiti">这段文字将以黑体显示</p>
    <p>
    <h1 id="last-paragraph">今天学习样式表的相关知识。</h1>
    </p>
</body>

</html>
