<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>样式表举例</title>
    <style>
        h1 {
            font-size: 36px;
            font-family: "隶书";
            font-weight: bold;
            color: #993366;
        }
    </style>
</head>

<body>
    <p style="color:#ff0000">这段文字将显示为红色</p>
    <p style="color:#000000; background-color:yellow;">这段文字的背景色为<font color="FF0000"><b>黄色</b></font>
    </p>
    <p style="font-family: '黑体'; font-size:24px;">这段文字将以黑体显示</p>
    <p>
    <h1 align="center">今天学习样式表的相关知识。</h1>
    </p>
</body>

</html>
