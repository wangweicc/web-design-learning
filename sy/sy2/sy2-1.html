<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本与段落格式化</title>
    <style>
        .yiji {
            text-align: center;
        }

        .sanji {
            text-align: left;
        }

        .liuji {
            text-align: right;
        }

        .suojin {
            text-indent: 16px;
        }

        .wenben {
            text-align: center;
            font-family: "华文彩云";
            color: red;
            font-size: 20px;
        }

        .biaoji {
            text-align: center;
            font-family: "黑体";
        }

        .qingxie {
            text-align: center;
        }
    </style>
</head>

<body>
    <p>
        <strong>【标题字应用】</strong>
    </p>

    <h1 class="yiji">这是一级标题，居中对齐</h1>

    <h3 class="sanji">这是三级标题，左对齐</h3>

    <h6 class="liuji">这是六级标题，右对齐</h6>

    <hr style="color: red;background-color: red;height: 2px;">

    <P>
        <strong>【段落、字体标记应用】</strong>
    </P>

    <p class="suojin">
        通过实验项目的方式介绍了常用web前端开发工具的基本功能，让学生边实验边熟悉开发工具的功能与特点，掌握每种开发工具对网站设计与开发的作用。
    </p>

    <p class="wenben">
        这是一段文本
    </p>

    <hr style="color: #00cc66;background-color: #00cc66;height: 3px;">

    <p>
        <strong>【物理、逻辑样式标记应用】</strong>
    </p>

    <p class="biaoji">
        <b>这是黑体标记b应用</b><br>
        <i>这是斜体标记i应用</i><br>
        Microsoft Windows 2007<br>
        <u>这是下划线标记u</u><br>
        <s>这是删除线标记s</s><br>
        x<sub>1</sub>+x<sub>2</sub>=10<br>
        2X<sup>2</sup>+3x=9<br>
        <em>这是强调标记em应用！</em><br>
        地址：<br>
        <em>江苏省南京市珠江路1924号</em>
        <hr style="text-align: center;width: 50%;height: 3px;background-color: #33ffff;">
    </p>

</body>

</html>
