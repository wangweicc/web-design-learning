<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <strong>数字编号：</strong>
    <ol>
        <li>苹果</li>
        <li>香蕉</li>
        <li>柠檬</li>
        <li>桔子</li>
    </ol>

    <strong>字母编号：</strong>
    <ol type="A" start="3">
        <li>苹果</li>
        <li>香蕉</li>
        <li>柠檬</li>
        <li>桔子</li>
    </ol>

    <strong>混合编号：</strong>
    <ol>
        <li type="a">苹果</li>
        <li type="I" value="4">香蕉</li>
        <li type="a" value="5">柠檬</li>
        <li type="a" value="6">桔子</li>
        <li type="a" value="7">蜜桃</li>
        <li type="a" value="8">草莓</li>
    </ol>
</body>

</html>
