<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用JavaScript代码改变网页字号大小</title>
    <style>
        #content {
            margin: -21px 0px 40px 0px;
            padding: 20px;
            border: 3px solid #cacf78;
            text-indent: 2em;
            color: #5081d1;
        }

        .con {
            margin: auto;
            padding: 20px;
            font-size: 18px;
            text-align: center;
        }

        .font-size-option {
            margin: 0 10px;
            color: rgb(186, 112, 186);
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
        }

        .font-size-option:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1 style="text-align: center;">用JavaScript代码改变网页字号大小</h1>
    <div class="con">
        <label for="fontSize">选择字号：</label>
        【
        <a href="#" class="font-size-option" onclick="changeFontSize('small')">小</a>
        <a href="#" class="font-size-option" onclick="changeFontSize('medium')">中</a>
        <a href="#" class="font-size-option" onclick="changeFontSize('large')">大</a>
        】
    </div>

    <div id="content">

        <p id="text">
            JavaScript是一种能让您的网页更加生动活泼的程式语言，也是目前网页设计中最容易学又最方便的语言。你可以利用JavaScript轻易的做出亲切的欢迎讯息、漂亮的数字钟、有广告效果的跑马灯及简易的选举，还可以显示浏览器停留的时间。让这些特殊效果提高网页的可观性。
        </p>
    </div>

    <script>
        function changeFontSize(size) {
            const textElement = document.getElementById('text');

            switch (size) {
                case 'small':
                    textElement.style.fontSize = '14px';
                    break;
                case 'medium':
                    textElement.style.fontSize = '18px';
                    break;
                case 'large':
                    textElement.style.fontSize = '24px';
                    break;
                default:
                    textElement.style.fontSize = '16px';
            }
        }
    </script>
</body>

</html>
